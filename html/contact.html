<html>

        <meta charset="utf-8">

    <body>
        <div class="bgimg"></div> 
            <header class="header"> 
                <a class="header__home-link" href="../index.html"> 
                    <h1>fraimwork</h1>

                <nav class="navigation">
                     <a href="../index.html">Home</a> <a href="wiki.html">Wiki</a>
                     <a class="current__page" href="contact.html">Contact</a>
                </nav>
            </header>
            <main class="main">
                <form class="user__input" action="mailto: temp@yandex.ru" method="POST" enctype="text/plain">
                    <fieldset class="user__info">
                        <legend class="legend">Contact Info</legend>
                        <label for="e__mail">E-Mail</label>
                        <input required type="text" id="e__mail" class="e_mail" name="e__mail" placeholder="Enter E-Mail Adress">
                        <label for="name">Name</label>
                        <input required type="text" id="name" class="name" name="name" placeholder="Enter Name">
                    </fieldset>
                    <fieldset class="user__message">
                        <legend>Message</legend>
                        <label for="message">Message we'll answer with an automated AI response goes here</label>
                        <textarea name="message" id="message"></textarea>
                        <label class="check-box__promos" for="promotions">Subscribe to spam e-mails no one wants</label>
                        <input class="check-box" type="checkbox" id="promotions" name="promotions" value="promotions" checked>
                        <label class="check-box__sell-soul" for="sell-soul">Sell soul to data-brokers and evil corporations</label>
                        <input required class="check-box" type="checkbox" id="sell-soul" name="sell-soul" value="sell-soul">  
                    </fieldset>
                    <div class="button__wrapper"><button class="button__send">Send</button></div>
                </form>
            </main>
